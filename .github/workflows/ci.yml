name: FLOWTRUST-AFR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check HMI and edge JavaScript syntax
        run: |
          node --check app.js
          node --check app-t02.js
          node --check t02-live.js
          node --check deploy/vercel/t02_core.js
          node --check deploy/vercel/api/diagnose.js
          node --check deploy/vercel/api/health.js

      - name: Smoke-test deployed edge contract
        run: |
          node - <<'NODE'
          const edge = require('./deploy/vercel/t02_core');
          const h = edge.health();
          if (h.version !== '0.3.1') throw new Error('unexpected edge version');
          if (h.fusion_version !== 't02-edge-v1') throw new Error('unexpected fusion version');
          if (h.automatic_control_allowed !== false) throw new Error('read-only contract violated');
          console.log(h);
          NODE

      - name: Rebuild public ML snapshot
        run: python train_models.py

      - name: Run core and API tests
        run: python -m pytest -q
